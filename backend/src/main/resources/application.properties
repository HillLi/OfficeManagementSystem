server.port=8080
spring.application.name=office-management-system
spring.jackson.serialization.write-dates-as-timestamps=false

# Default mode uses an in-memory repository so the project can start without MySQL.
# Use the mysql profile after running scripts/init-mysql.ps1:
# D:\dev\maven\apache-maven-3.9.14\bin\mvn.cmd spring-boot:run -Dspring-boot.run.profiles=mysql
oms.repository=memory
oms.upload-dir=${user.home}/.oms/uploads
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

oms.mail.external-enabled=false
oms.mail.from-name=高校办公管理系统
spring.mail.host=
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
